openapi: 3.0.0
info:
  title: Contacts App API
  description: This is an API for a Contacts App for the Small Project in COP 4331
  contact:
    email: tiago@ucf.edu
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
servers:
- url: https://virtserver.swaggerhub.com/na-6b2/SmallProject_API/1.0.0
  description: SwaggerHub API Auto Mocking
- url: http://stealingyourinfo.xyz
  description: DigitalOcean Droplet
tags:
- name: developers
  description: Operations available to regular developers
paths:
  /api/login:
    post:
      tags:
      - developers
      summary: User login
      description: This endpoint signs in a user using email and password.
      operationId: loginUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: User successfully signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Invalid user data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/register:
    post:
      tags:
      - developers
      summary: User registration
      description: This endpoint registers a new user.
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          description: User successfully registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: "Missing fields, invalid email, invalid password, or passwords\
            \ do not match."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error registering user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts:
    get:
      tags:
      - developers
      summary: Get contacts
      description: Retrieves all contacts belonging to the authenticated user.
      operationId: getContacts
      parameters:
      - name: search
        in: query
        description: "Search bar used to filter contacts by first name, last name,\
          \ email or phone number."
        required: false
        style: form
        explode: true
        schema:
          type: string
        example: joh
      responses:
        "200":
          description: Contacts retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsResponse"
        "401":
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to retrieve contacts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    post:
      tags:
      - developers
      summary: Add contact
      description: Creates a new contact for the authenticated user.
      operationId: addContact
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "201":
          description: Contact added successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: First name or last name is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to add contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
  /api/contacts/{id}:
    get:
      tags:
      - developers
      summary: Get contact
      description: Retrieves a single contact by ID for the authenticated user.
      operationId: getContact
      parameters:
      - name: id
        in: path
        description: ID of the contact to retrieve.
        required: true
        schema:
          type: integer
        example: 1
      responses:
        "200":
          description: Contact retrieved successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
        "401":
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to retrieve contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    put:
      tags:
      - developers
      summary: Update contact
      description: Updates a contact by ID for the authenticated user.
      operationId: updateContactById
      parameters:
      - name: id
        in: path
        description: ID of the contact to update.
        required: true
        schema:
          type: integer
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
        required: true
      responses:
        "200":
          description: Contact updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: First name or last name is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to update contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
    delete:
      tags:
      - developers
      summary: Delete contact
      description: Deletes a contact by ID for the authenticated user.
      operationId: deleteContactById
      parameters:
      - name: id
        in: path
        description: ID of the contact to delete.
        required: true
        schema:
          type: integer
        example: 1
      responses:
        "200":
          description: Contact deleted successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Missing or invalid JWT token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Failed to delete contact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      security:
      - bearerAuth: []
components:
  schemas:
    LoginRequest:
      required:
      - email
      - password
      type: object
      properties:
        email:
          type: string
          format: email
          example: john@example.com
        password:
          type: string
          example: password123
    RegisterRequest:
      required:
      - confirmPassword
      - email
      - firstName
      - lastName
      - password
      type: object
      properties:
        firstName:
          type: string
          example: John
        lastName:
          type: string
          example: Smith
        email:
          type: string
          format: email
          example: john@example.com
        password:
          minLength: 8
          type: string
          example: password123
        confirmPassword:
          minLength: 8
          type: string
          example: password123
    LoginResponse:
      required:
      - message
      - token
      - user
      type: object
      properties:
        message:
          type: string
          example: Login successful.
        user:
          type: object
          properties:
            id:
              type: integer
              example: 1
            firstName:
              type: string
              example: John
            lastName:
              type: string
              example: Smith
            email:
              type: string
              format: email
              example: john@example.com
        token:
          type: string
          description: JWT authentication token used for accessing protected endpoints.
            Include it in future requests using the Authorization header as a bearer
            token.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c
    MessageResponse:
      required:
      - message
      type: object
      properties:
        message:
          type: string
          example: Operation completed successfully.
    ErrorResponse:
      required:
      - error
      type: object
      properties:
        error:
          type: string
          example: Invalid email or password.
    Contact:
      type: object
      properties:
        id:
          type: integer
          example: 1
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Smith
        phone_number:
          type: string
          example: "4071234567"
        email_address:
          type: string
          format: email
          example: john@example.com
    ContactsResponse:
      required:
      - contacts
      - message
      type: object
      properties:
        message:
          type: string
          example: The user's contacts were retrieved successfully.
        contacts:
          type: array
          items:
            $ref: "#/components/schemas/Contact"
      example:
        message: The user's contacts were retrieved successfully.
        contacts:
        - id: 1
          first_name: John
          last_name: Smith
          phone_number: 4071234567
          email_address: john@example.com
    ContactRequest:
      required:
      - first_name
      - last_name
      type: object
      properties:
        first_name:
          type: string
          example: John
        last_name:
          type: string
          example: Smith
        phone_number:
          type: string
          example: "4071234567"
        email_address:
          type: string
          format: email
          example: john@example.com
    ContactResponse:
      required:
      - contact
      - message
      type: object
      properties:
        message:
          type: string
          example: Contact retrieved successfully.
        contact:
          $ref: "#/components/schemas/Contact"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
